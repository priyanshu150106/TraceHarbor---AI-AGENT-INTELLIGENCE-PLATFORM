[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceharbor"
version = "0.1.0"
description = "TraceHarbor Python SDK — Automated Tracing, Evaluation, and Security for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Priyanshu Raman", email = "priyanshu150106@gmail.com" }
]
keywords = ["llm", "tracing", "observability", "agents", "evaluation", "security"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
