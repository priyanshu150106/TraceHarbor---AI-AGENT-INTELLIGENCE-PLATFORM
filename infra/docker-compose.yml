# ============================================
# TraceHarbor — Docker Compose (Development)
# ============================================
# Usage:  docker compose -f infra/docker-compose.yml up -d
# Requires: Docker Engine 24+ with Compose V2
# ============================================

services:
  # ---------- PostgreSQL + pgvector ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: traceharbor-postgres
    restart: unless-stopped
    ports:
      # Bind to localhost only — never expose DB to the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-th}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-traceharbor}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-th} -d ${POSTGRES_DB:-traceharbor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: traceharbor-redis
    restart: unless-stopped
    ports:
      # Bind to localhost only
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
